# Celery와 Redis가 필요 없어져 훨씬 간단해진 docker-compose.yml
services:
  app:
    build: .

    environment:
      - TZ=Asia/Seoul  # [추가] 이 한 줄이면 서버 시간이 서울로 바뀜

    ports:
      - "8000:8000" 
    env_file:
      - .env
    
    # (!!!) 로컬(Mac)에서 AI 서버(localhost:8000)와 통신하기 위한 설정
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    
    # (!!!) redis 의존성 삭제
    # depends_on:
    #   - redis 
    depends_on:
      - db # 로컬 DB 의존성은 유지

  # (!!!) db 서비스는 로컬 테스트용으로 그대로 둡니다. (AWS 배포 시 주석 처리)
  db:
    image: mysql:8.0
    ports:
      - "3307:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # 로컬 .env 파일에서 읽음
      MYSQL_DATABASE: ${MYSQL_DATABASE}           # 로컬 .env 파일에서 읽음
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # (!!!) redis 서비스 삭제
  # redis:
  #   ...

  # (!!!) worker 서비스 삭제
  # worker:
  #   ...

volumes:
  db_data: # 로컬 db 볼륨 활성화
