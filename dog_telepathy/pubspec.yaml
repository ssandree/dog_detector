name: dog_telepathy
description: Dog emotion analysis app
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  animate_do: ^4.2.0
  awesome_dialog: ^3.3.0
  camera: ^0.11.3
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  email_validator: ^3.0.0
  fl_chart: ^1.1.1
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^19.5.0
  flutter_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_settings_screens: ^0.3.4
  fluttertoast: ^8.2.4
  gap: ^3.0.1
  go_router: ^17.0.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^3.0.3
  intl: ^0.20.2
  loading_animation_widget: ^1.2.0+4
  logger: ^2.6.2
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  table_calendar: ^3.2.0
  smooth_page_indicator: ^1.2.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  build_runner: ^2.4.6
  custom_lint: ^0.6.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/onboarding/
    - lib/core/picture/logo.png
    - lib/core/picture/puppy.jpg
    - lib/core/picture/onboarding_1st.jpg
    - lib/core/picture/onboarding_2nd.jpg
    - lib/core/picture/onboarding_3rd.jpg
