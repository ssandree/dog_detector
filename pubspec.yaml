name: dog_detect
description: "반려견 감정 탐지 Flutter 프로젝트"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 1️⃣ UI·디자인
  cupertino_icons: ^1.0.8 # iOS 스타일 아이콘 세트
  google_fonts: ^6.2.1 # 구글 폰트(한글 폰트 포함)
  fl_chart: ^1.1.1 # 그래프/차트 시각화(Line, Bar, Pie 등)
  table_calendar: ^3.2.0 # 날짜별 감정 리포트용 캘린더 위젯
  loading_animation_widget: ^1.2.0+4 # 로딩 애니메이션 위젯
  awesome_dialog: ^3.3.0 # 팝업/다이얼로그 UI
  fluttertoast: ^8.2.4 # 간단한 토스트 메시지 표시

  # 2️⃣ 네트워크·데이터 통신
  dio: ^5.9.0 # HTTP 클라이언트(파일 업로드, 서버 통신, 에러 핸들링 담당)
  connectivity_plus: ^7.0.0 # 네트워크 연결 상태 감지(오프라인 시 fallback 처리)
  web_socket_channel: ^3.0.1 # WebSocket 통신(실시간 AI 스트리밍용)

  # 3️⃣ 상태 관리·라우팅
  flutter_riverpod: ^3.0.3 # Provider 정의용 핵심 로직 계층(StateProvider, Provider, Ref 등)
  hooks_riverpod: ^3.0.3 # Riverpod + Hooks 통합 UI 계층(HookConsumerWidget, useState 등)
  go_router: ^14.2.0 # 화면 이동 및 네비게이션 라우팅
  logger: ^2.6.2 # 네트워크 응답·예외 로깅(print() 상위 호환)

  # 4️⃣ 카메라·녹화·파일 처리
  camera: ^0.11.3 # 카메라 프리뷰 및 녹화 제어(Flutter 공식 플러그인)
  path_provider: ^2.1.5 # 임시 폴더 접근(업로드 전 영상 임시 저장용)
  path: ^1.9.0 # 파일명·경로 처리 유틸(basename, join 등)
  permission_handler: ^12.0.1 # 카메라·마이크 권한 요청 및 상태 확인
  flutter_animate: ^4.5.2 # 촬영 안내/가이드용 애니메이션(오버레이 등 시각 효과)

  # 5️⃣ 로컬 저장소·캐시
  shared_preferences: ^2.3.0 # 단순 설정값 로컬 저장(테마, 알림 on/off 등)
  hive: ^2.2.3 # 로컬 DB(감정 로그·리포트 캐싱)
  hive_flutter: ^1.1.0 # Hive 초기화 및 Flutter 통합
  flutter_local_notifications: ^19.5.0 # 일·주·월 리포트 생성 알림 전송
  flutter_settings_screens: ^0.3.4 # 설정 화면 템플릿(SettingsGroup, SwitchTile 등)

  # 6️⃣ 기타 유틸
  email_validator: ^2.1.17 # 이메일 형식 유효성 검사
  intl: ^0.20.2 # 날짜, 숫자, 통화 포맷 처리

dev_dependencies:
  flutter_test:
    sdk: flutter # 위젯·통합 테스트 기본 프레임워크

  # 코드 품질 관리
  flutter_lints: ^6.0.0 # 코드 스타일 및 규칙 검사
  custom_lint: ^0.6.4 # 코드 검사 로직 실행용(Riverpod, 프로젝트별 규칙 포함)

  # 코드 생성 및 Hive 모델 빌드
  build_runner: ^2.4.6 # 자동 코드 생성 도구(Hive 어댑터 빌드용)
  hive_generator: ^2.0.1 # Hive 모델 직렬화 코드 생성

flutter:
  uses-material-design: true

  assets:
    - lib/config/logo.png
